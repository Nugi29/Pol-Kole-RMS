spring:
  datasource:
    # Support overriding via environment variables for security in different environments
    url: ${DB_URL:jdbc:mysql://localhost:3306/pol-kole-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Use the generic MySQL dialect available in Hibernate 7+; MySQL8Dialect may not exist
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: localhost
    port: 25
    test-connection: false
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  health:
    mail:
      enabled: false
