<div class="space-y-6">
  <div>
    <h1 class="text-[22px] font-bold text-slate-900 leading-none">Security Audit Logs</h1>
    <p class="text-[13px] text-slate-400 mt-2">View system history, logins, check-ins, check-outs, and checkout payment audits.</p>
  </div>

  <div *ngIf="errorMessage" class="bg-red-50 text-red-600 text-[12px] p-3 rounded-lg font-semibold">
    {{ errorMessage }}
  </div>

  <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-[14px] font-bold text-slate-900">Security Ledger</h2>
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="w-full text-left text-[13px] text-slate-700">
        
        <ng-container matColumnDef="timestamp">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-slate-900 border-b border-slate-100 pb-3">Timestamp</th>
          <td mat-cell *matCellDef="let log" class="py-3 border-b border-slate-50 text-slate-400 font-mono text-[12px]">{{ log.createdAt | date:'medium' }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-slate-900 border-b border-slate-100 pb-3">Action</th>
          <td mat-cell *matCellDef="let log" class="py-3 border-b border-slate-50"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[11px] font-bold">{{ log.action }}</span></td>
        </ng-container>

        <ng-container matColumnDef="details">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-slate-900 border-b border-slate-100 pb-3">Audit Details</th>
          <td mat-cell *matCellDef="let log" class="py-3 border-b border-slate-50 font-medium text-slate-800">{{ log.details }}</td>
        </ng-container>

        <ng-container matColumnDef="performedBy">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-slate-900 border-b border-slate-100 pb-3">User Principal</th>
          <td mat-cell *matCellDef="let log" class="py-3 border-b border-slate-50 font-bold">{{ log.performedBy }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons class="border-t border-slate-100 pt-2"></mat-paginator>
  </div>
</div>
