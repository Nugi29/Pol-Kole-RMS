<aside
  id="sidebar"
  class="fixed left-0 top-0 z-50 flex h-screen flex-col border-r border-slate-100 bg-white select-none transition-[width] duration-200"
  [ngClass]="isSidebarCollapsed ? 'w-[88px]' : 'w-[260px]'">

  <!-- Logo -->
  <div class="border-b border-slate-50" [ngClass]="isSidebarCollapsed ? 'px-3 pt-4 pb-3' : 'px-5 pt-5 pb-4'">
    <div class="flex items-center" [ngClass]="isSidebarCollapsed ? 'justify-center gap-0' : 'gap-3'">
      <div class="w-10 h-10  overflow-hidden flex items-center justify-center flex-shrink-0 bg-white p-0.5">
        <img
          [src]="settingsService.logoUrl() || 'assets/polkolelogo.png'"
          (error)="$any($event.target).src='assets/polkolelogo.png'"
          alt="Pol-Kole Logo"
          class="w-full h-full object-contain" />
      </div>
      <div *ngIf="!isSidebarCollapsed">
        <p class="text-[15px] font-bold text-slate-900 tracking-tight leading-tight uppercase ">{{ settingsService.restaurantShortName() }}</p>
        <span class="text-[10px] font-semibold bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded-full tracking-wide">{{ settingsService.slogan()}}</span>
      </div>
      <button
        type="button"
        (click)="toggleSidebar()"
        class="rounded-lg border border-slate-200 p-1 text-slate-500 transition-colors hover:bg-slate-50 hover:text-slate-700"
        [ngClass]="isSidebarCollapsed ? 'absolute top-5 right-0' : 'ml-auto'"
        [attr.aria-label]="isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path *ngIf="!isSidebarCollapsed" stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          <path *ngIf="isSidebarCollapsed" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Scrollable nav -->
  <div class="flex-1 overflow-y-auto py-3 space-y-5" [ngClass]="isSidebarCollapsed ? 'px-2' : 'px-3'">

    <!-- MAIN section -->
    <div>
      <p *ngIf="!isSidebarCollapsed" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.8px] px-2 mb-1.5">Main</p>
      <nav class="space-y-0.5" aria-label="Main navigation">
        <ng-container *ngFor="let item of navMenu">
          <ng-container *ngIf="item.children?.length; else singleLink">
            <button
              type="button"
              (click)="onGroupClick(item)"
              class="w-full flex items-center gap-2.5 py-[7px] rounded-lg text-[13.5px] font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-800 transition-all cursor-pointer"
              [ngClass]="isSidebarCollapsed ? 'justify-center px-0' : 'px-2.5'"
              [class.justify-center]="isSidebarCollapsed">
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIconPath(item.icon)"></path>
              </svg>
              <span *ngIf="!isSidebarCollapsed" class="flex-1 text-left">{{item.name}}</span>
              <svg *ngIf="!isSidebarCollapsed" class="chevron w-3.5 h-3.5" [class.open]="isGroupExpanded(item.name)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
            <div *ngIf="!isSidebarCollapsed" class="subnav" [style.max-height.px]="isGroupExpanded(item.name) ? getSubnavHeight(item) : 0">
              <div class="pl-8 space-y-0.5 pt-0.5">
                <a
                  *ngFor="let child of item.children"
                  [routerLink]="getRoutePath(child.route)"
                  [queryParams]="getRouteQueryParams(child.route)"
                  routerLinkActive="text-indigo-600 bg-indigo-50"
                  class="nav-link sub-link flex items-center gap-2 px-2 py-1.5 rounded-lg text-[13px] font-medium transition-all cursor-pointer text-slate-400 hover:text-slate-700 hover:bg-slate-50">
                  <span class="w-1.5 h-1.5 rounded-full bg-current opacity-60 flex-shrink-0"></span>
                  {{child.name}}
                </a>
              </div>
            </div>
          </ng-container>

          <ng-template #singleLink>
            <a
              [routerLink]="getRoutePath(item.route || '')"
              [queryParams]="getRouteQueryParams(item.route || '')"
              routerLinkActive="bg-indigo-50 text-indigo-600"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link flex items-center gap-2.5 py-[7px] rounded-lg text-[13.5px] font-medium cursor-pointer transition-all text-slate-500 hover:bg-slate-50 hover:text-slate-800"
              [ngClass]="isSidebarCollapsed ? 'justify-center px-0' : 'px-2.5'"
              [class.justify-center]="isSidebarCollapsed">
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIconPath(item.icon)"></path>
              </svg>
              <span *ngIf="!isSidebarCollapsed">{{item.name}}</span>
            </a>
          </ng-template>
        </ng-container>
      </nav>
    </div>

  </div>

  <!-- Theme Toggle Switch -->
  <div class="px-3 py-2 border-t border-slate-100/50">
    <button
      type="button"
      (click)="toggleTheme()"
      class="w-full flex items-center gap-2.5 py-[7px] rounded-lg text-[13px] font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-800 transition-all cursor-pointer"
      [ngClass]="isSidebarCollapsed ? 'justify-center px-0' : 'px-2.5'">
      <svg *ngIf="isDarkMode" class="w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
      </svg>
      <svg *ngIf="!isDarkMode" class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
      <span *ngIf="!isSidebarCollapsed" class="flex-1 text-left">{{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}</span>
    </button>
  </div>

  <!-- User card footer -->
  <div
    class="border-t border-slate-100/80 transition-all duration-300"
    [ngClass]="isSidebarCollapsed ? 'p-2' : 'px-3 py-2.5'"
  >
    <div
      class="w-full flex items-center rounded-xl p-1.5 transition-all duration-200 ease-out bg-slate-50/80 border border-slate-100"
      [ngClass]="isSidebarCollapsed ? 'justify-center gap-0' : 'gap-2.5'"
    >
      <!-- Avatar with initials -->
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white text-[11px] font-bold shadow-xs flex-shrink-0">
        {{ name ? name.substring(0, 2).toUpperCase() : 'U' }}
      </div>

      <!-- User info -->
      <div *ngIf="!isSidebarCollapsed" class="text-left flex-1 min-w-0">
        <p class="text-[12px] font-bold text-slate-800 leading-tight truncate">{{ name || 'Staff Member' }}</p>
        <p class="text-[10px] font-semibold text-indigo-600 leading-tight truncate uppercase tracking-wider mt-0.5">{{ role || 'Staff' }}</p>
      </div>

      <!-- Logout icon button -->
      <button
        type="button"
        (click)="logout()"
        title="Sign Out"
        class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-red-600 hover:bg-red-50 transition-all cursor-pointer flex-shrink-0"
        [class.hidden]="isSidebarCollapsed"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </div>
</aside>

<!-- Main content (ml-[260px] offset) -->
<main
  class="min-h-screen bg-slate-50 dark:bg-slate-950 p-7 transition-[margin] duration-200"
  [ngClass]="isSidebarCollapsed ? 'ml-0 md:ml-[88px]' : 'ml-0 md:ml-[260px]'">

  <router-outlet></router-outlet>
</main>
