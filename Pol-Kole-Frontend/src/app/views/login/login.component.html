<div
  class="login-wrapper"
  [style.background-image]="'url(' + loginBgImageUrl + ')'"
>
  <!-- Session check loading overlay -->
  <div class="session-loader-overlay" *ngIf="isCheckingSession">
    <mat-spinner diameter="60" color="primary"></mat-spinner>
    <div class="session-loader-text">Verifying secure session...</div>
    <div class="session-loader-subtext">Redirecting to your dashboard</div>
  </div>

  <!-- Login Form Card -->
  <mat-card class="login-card" *ngIf="!isCheckingSession">
    <mat-card-content class="login-card-content">
      <div class="header-container">
        <img
          [src]="settingsService.logoUrl() || 'assets/polkolelogo.png'"
          (error)="$any($event.target).src='assets/polkolelogo.png'"
          alt="Logo"
          class="brand-logo"
        />
        <h1 class="welcome-title">Welcome to <br>Restaurant and Resort Management System</h1>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <!-- Email field -->
        <mat-form-field appearance="outline" class="w-full custom-form-field">
          <mat-label>Email Address</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            [disabled]="isSubmitting"
            placeholder="name@example.com"
            autocomplete="email"
            required
          />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <!-- Password field -->
        <mat-form-field appearance="outline" class="w-full custom-form-field">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            name="password"
            [(ngModel)]="password"
            [disabled]="isSubmitting"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <mat-icon matPrefix>lock</mat-icon>
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            [disabled]="isSubmitting"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <!-- Error Message Banner -->
        <div *ngIf="errorMessage" class="error-banner animate-fade-in">
          <mat-icon>error_outline</mat-icon>
          <span class="error-text">{{ errorMessage }}</span>
        </div>

        <!-- Submit Button -->
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="isSubmitting"
          class="login-btn w-full"
        >
          <span class="btn-content-wrapper">
            <span *ngIf="!isSubmitting">Log In</span>
            <span *ngIf="isSubmitting" class="loading-btn-content">
              <mat-spinner diameter="18" class="button-spinner"></mat-spinner>
              <span>Logging in...</span>
            </span>
          </span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
