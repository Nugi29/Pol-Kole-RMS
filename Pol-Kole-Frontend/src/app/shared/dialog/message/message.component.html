<mat-card class="dialog-card toast-card" role="alert" aria-live="assertive" (click)="dismiss()" title="Click to dismiss">
  <mat-card-header class="dialog-header">
    <div class="toast-header-inner">
      <mat-card-title class="toast-title">{{ data.heading }}</mat-card-title>
      <button type="button" class="toast-close-btn" aria-label="Close" (click)="dismiss(); $event.stopPropagation()">
        &times;
      </button>
    </div>
  </mat-card-header>

  <mat-card-content class="dialog-content">
    <p *ngFor="let line of lines" class="dialog-line">{{ line }}</p>
  </mat-card-content>

  <div class="toast-progress-track">
    <div class="toast-progress-bar" [style.animation-duration.ms]="duration"></div>
  </div>
</mat-card>
