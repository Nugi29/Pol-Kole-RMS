version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Navigating to frontend directory and installing dependencies..."
      - cd Pol-Kole-Frontend
      - npm ci

  pre_build:
    commands:
      - echo "Preparing environment configuration..."
      - node scripts/set-env.js

  build:
    commands:
      - echo "Building Angular application in production mode..."
      - npm run build

artifacts:
  files:
    - '**/*'
  base-directory: Pol-Kole-Frontend/dist/Pol-Kole-Frontend/browser

cache:
  paths:
    - 'Pol-Kole-Frontend/node_modules/**/*'
